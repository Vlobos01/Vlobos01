<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="bannerTitle">
  <title id="bannerTitle">Agustín Verga Lobos — Analista en Sistemas</title>

  <!--
    ══════════════════════════════════════════════════════════════════
      PALETA  →  sacada del logo (azul #006FFD + blanco)
    ══════════════════════════════════════════════════════════════════
      azul logo   #006FFD
      azul claro  #4DA3FF
      celeste     #00C2FF
      blanco      #EAF2FF
      fondo       #03060D  →  #0A1220
      texto       #B9C9DA  /  #7C8CA3
    ══════════════════════════════════════════════════════════════════
  -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03060D"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="64" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFE0FF"/>
      <stop offset="0.5" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#006FFD"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="64" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C2FF"/>
      <stop offset="1" stop-color="#006FFD"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#006FFD" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#006FFD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00C2FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>

    <filter id="termShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <clipPath id="frame">
      <rect width="1200" height="320" rx="24"/>
    </clipPath>

    <style>
      .sans { font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- fondo -->
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- luces -->
    <circle cx="120" cy="10" r="300" fill="url(#glowCyan)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="250" r="300" fill="url(#glowBlue)">
      <animate attributeName="opacity" values="1;0.6;1" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- pill de estado -->
    <rect x="64" y="34" width="240" height="30" rx="15"
          fill="#006FFD" fill-opacity="0.14"
          stroke="#4DA3FF" stroke-opacity="0.45"/>
    <circle cx="84" cy="49" r="4.5" fill="#00C2FF">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="53" class="sans" font-size="11.5" font-weight="600"
          letter-spacing="1.6" fill="#9FD4FF">ANALISTA EN SISTEMAS</text>

    <!-- nombre -->
    <text x="64" y="138" class="sans" font-size="56" font-weight="800"
          letter-spacing="-1" fill="#EAF2FF">AGUSTÍN</text>
    <text x="64" y="196" class="sans" font-size="56" font-weight="800"
          letter-spacing="-1" fill="url(#nameGrad)">VERGA LOBOS</text>

    <!-- barra de acento -->
    <rect x="64" y="214" width="140" height="4" rx="2" fill="url(#barGrad)"/>

    <!-- tagline -->
    <text x="64" y="246" class="sans" font-size="18" font-weight="500"
          fill="#B9C9DA">C# · .NET · ASP.NET · React · JavaScript</text>

    <!-- ubicación -->
    <text x="64" y="272" class="sans" font-size="13.5" fill="#6F8299"
          >Buenos Aires, Argentina · Abierto a oportunidades</text>

    <!-- terminal -->
    <g filter="url(#termShadow)">
      <rect x="712" y="64" width="424" height="196" rx="14"
            fill="#050A14" stroke="#1B3358" stroke-width="1"/>
      <path d="M712 78a14 14 0 0 1 14-14h396a14 14 0 0 1 14 14v24H712z" fill="#0A1526"/>
      <rect x="712" y="101" width="424" height="1" fill="#1B3358"/>
    </g>
    <circle cx="736" cy="83" r="5.5" fill="#FF5F57"/>
    <circle cx="758" cy="83" r="5.5" fill="#FEBC2E"/>
    <circle cx="780" cy="83" r="5.5" fill="#28C840"/>
    <text x="1120" y="87.5" text-anchor="end" class="mono" font-size="11"
          fill="#5B7BA6">powershell</text>

    <text x="736" y="132" class="mono" font-size="14">
      <tspan fill="#00C2FF">$</tspan><tspan fill="#EAF2FF" dx="9">whoami</tspan>
    </text>
    <text x="736" y="160" class="mono" font-size="14" fill="#7C8CA3">Vlobos01</text>
    <text x="736" y="188" class="mono" font-size="14">
      <tspan fill="#00C2FF">$</tspan><tspan fill="#EAF2FF" dx="9">dotnet run</tspan>
    </text>
    <text x="736" y="216" class="mono" font-size="14" fill="#4DA3FF">&gt; compilado en 312 ms</text>
    <text x="736" y="244" class="mono" font-size="14" fill="#4DA3FF">&gt; escuchando en :5000</text>
    <rect x="920" y="231" width="8" height="15" rx="2" fill="#00C2FF">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <!-- brillo interior del borde -->
    <rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.06"/>
  </g>
</svg>
